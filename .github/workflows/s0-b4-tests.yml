name: S0-B4 baseline save/load characterization (tests only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s0-b4-baseline-save-load
  cancel-in-progress: false

jobs:
  characterize:
    name: Historical and Sandbox save/load determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the isolated experiment branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/experiment/vic3-visual-upgrade" ]]; then
            echo "::error::Run this workflow with branch experiment/vic3-visual-upgrade selected."
            exit 1
          fi

      - name: Checkout frozen product baseline
        uses: actions/checkout@v4
        with:
          ref: 2240a8fb865e0021eec2f2f4f1c6803528be9e2c
          path: baseline

      - name: Checkout audit-only test harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: audit-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: baseline/package-lock.json

      - name: Run B4 characterization on the exact baseline
        id: b4
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/ci-evidence"
          mkdir -p "$EVIDENCE"

          BASELINE_SHA="$(git -C "$GITHUB_WORKSPACE/baseline" rev-parse HEAD)"
          AUDIT_SHA="$(git -C "$GITHUB_WORKSPACE/audit-source" rev-parse HEAD)"
          EXPECTED_BASELINE="2240a8fb865e0021eec2f2f4f1c6803528be9e2c"
          if [[ "$BASELINE_SHA" != "$EXPECTED_BASELINE" ]]; then
            echo "::error::Baseline SHA mismatch: $BASELINE_SHA"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/baseline/tests/fixtures"
          cp "$GITHUB_WORKSPACE/audit-source/tests/s0-save-determinism.test.ts" "$GITHUB_WORKSPACE/baseline/tests/"
          cp "$GITHUB_WORKSPACE/audit-source/tests/fixtures/s0-b4-scenario.ts" "$GITHUB_WORKSPACE/baseline/tests/fixtures/"

          {
            echo "baseline_sha=$BASELINE_SHA"
            echo "audit_source_sha=$AUDIT_SHA"
            echo "audit_ref=$GITHUB_REF"
            echo "event=$GITHUB_EVENT_NAME"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "scenario_baseline_sha=$EXPECTED_BASELINE"
            sha256sum "$GITHUB_WORKSPACE/baseline/tests/s0-save-determinism.test.ts"
            sha256sum "$GITHUB_WORKSPACE/baseline/tests/fixtures/s0-b4-scenario.ts"
            sha256sum "$GITHUB_WORKSPACE/baseline/package-lock.json"
          } > "$EVIDENCE/provenance-and-fixture-hashes.txt"

          cd "$GITHUB_WORKSPACE/baseline"
          failed=0

          run_logged() {
            local name="$1"
            shift
            set +e
            "$@" 2>&1 | tee "$EVIDENCE/$name.log"
            local rc=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$rc" > "$EVIDENCE/$name.exit_code"
            if [[ "$rc" -ne 0 ]]; then failed=1; fi
          }

          run_logged npm-ci npm ci
          if [[ "$(cat "$EVIDENCE/npm-ci.exit_code")" == "0" ]]; then
            run_logged prepare-assets npm run prepare-assets
          fi

          if [[ -f "$EVIDENCE/prepare-assets.exit_code" && "$(cat "$EVIDENCE/prepare-assets.exit_code")" == "0" ]]; then
            {
              for file in src/generated/db.json src/generated/map.json; do
                if [[ -f "$file" ]]; then sha256sum "$file"; else echo "MISSING $file"; failed=1; fi
              done
            } > "$EVIDENCE/generated-data-hashes.txt"

            run_logged typecheck npm run typecheck
            if [[ "$(cat "$EVIDENCE/typecheck.exit_code")" == "0" ]]; then
              run_logged characterization npx vitest run tests/s0-save-determinism.test.ts --reporter=verbose --reporter=json --outputFile="$EVIDENCE/vitest-results.json"
            fi
          fi

          {
            echo "baseline_sha=$BASELINE_SHA"
            echo "audit_source_sha=$AUDIT_SHA"
            for file in "$EVIDENCE"/*.exit_code; do
              [[ -f "$file" ]] || continue
              echo "$(basename "$file" .exit_code)=$(cat "$file")"
            done
            echo "overall_exit_code=$failed"
          } | tee "$EVIDENCE/result-summary.txt" >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"

      - name: Upload B4 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s0-b4-save-load-evidence-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 30
